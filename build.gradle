/*
 * PMCA_IntervalCapture 机内间隔拍照应用 —— 根 Gradle 构建脚本
 *
 * 说明：
 *   - 本工程面向索尼 PlayMemories Camera Apps（PMCA）运行时，
 *     其本质是运行在相机内部的 Android 2.3.7（API Level 10）虚拟机。
 *   - 构建产物是一个 APK，之后需要用 PMCA-RE 工具的 apk2spk + install 流程刷入相机。
 *   - 官方 Camera Apps SDK 以本地 jar/aar 形式放在 build-support/libs 下，
 *     通过 fileTree 依赖引入，不依赖任何联网仓库。
 */
buildscript {
    repositories {
        // 官方 Camera Apps SDK（PMCA SDK）以本地文件引入，这里只保留 Google/Maven 仓库以获取构建插件
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle Plugin：使用 4.1.x，兼容 compileSdk 10 + buildTools 30.x
        classpath 'com.android.tools.build:gradle:4.1.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// 清理任务：删除各模块 build 目录
task clean(type: Delete) {
    delete rootProject.buildDir
}
